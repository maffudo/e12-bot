name: Alerte E12

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e12-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          SOURCES: "ebay,html"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python bot.py

      - name: Sauvegarder la mémoire des annonces vues
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "e12-bot"
            git config user.email "e12-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "maj mémoire des annonces [skip ci]"
            git pull --rebase --autostash
            git push
          fi
